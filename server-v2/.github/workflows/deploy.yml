name: Gateway — Deploy Fly.io (gru)

on:
  push:
    branches: [main]
    paths: ["server-v2/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["server-v2/**"]
  workflow_dispatch:
    inputs:
      emergency:
        description: "Hotfix — ignora o gate de horário comercial e de sessões ativas"
        type: boolean
        default: false

concurrency:
  group: gateway-deploy
  cancel-in-progress: false

env:
  FLY_APP: inovvatur-copiloto-api
  APP_URL: https://inovvatur-copiloto-api.fly.dev

defaults:
  run:
    working-directory: server-v2

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências
        run: npm audit --audit-level=high || echo "::warning::npm audit encontrou vulnerabilidades altas — revisar"
      - name: Nenhum segredo no bundle
        run: |
          if grep -rEn 'sk-ant-|dg_[A-Za-z0-9]{30,}|service_role|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' dist/; then
            echo "::error::Segredo encontrado no bundle. Abortando."; exit 1
          fi

  # Nunca fazer deploy com closer em call. Janela: antes das 8h, depois das 20h ou fim de semana (BRT).
  janela:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      liberado: ${{ steps.check.outputs.liberado }}
    steps:
      - id: check
        working-directory: .
        run: |
          if [ "${{ inputs.emergency }}" = "true" ]; then echo "liberado=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          HORA=$(TZ=America/Sao_Paulo date +%H); DIA=$(TZ=America/Sao_Paulo date +%u)
          if [ "$DIA" -gt 5 ] || [ "$HORA" -lt 8 ] || [ "$HORA" -ge 20 ]; then
            echo "liberado=true" >> "$GITHUB_OUTPUT"
          else
            echo "liberado=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fora da janela (08h-20h BRT). Rode manualmente à noite ou use emergency=true."
          fi

  deploy:
    needs: [qualidade, janela]
    if: github.event_name != 'pull_request' && needs.janela.outputs.liberado == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Bloquear deploy com sessão ativa
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          ATIVAS=$(curl -sf "$APP_URL/internal/sessoes" -H "Authorization: Bearer $INTERNAL_TOKEN" | jq -r '.active_sessions' || echo "0")
          echo "Sessões ativas: $ATIVAS"
          if [ "$ATIVAS" -gt 0 ] && [ "${{ inputs.emergency }}" != "true" ]; then
            echo "::error::$ATIVAS call(s) em andamento. Deploy bloqueado."; exit 1
          fi

      - name: Deploy blue-green
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --strategy bluegreen --wait-timeout 600 --build-arg GIT_SHA=${{ github.sha }}

      - name: Smoke test (health + pipeline WebSocket)
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TEST_JWT }}
        run: |
          curl -sf "$APP_URL/health" | jq -e '.ok == true'
          npx --yes tsx scripts/smoke-ws.ts --url "wss://${FLY_APP}.fly.dev/v1/stream" --token "$SMOKE_TOKEN" --max-latency-ms 2500

      - name: Rollback automático
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ANTERIOR=$(flyctl releases list -a "$FLY_APP" --json | jq -r '.[1].version')
          echo "::error::Deploy falhou. Rollback para v$ANTERIOR."
          flyctl deploy -a "$FLY_APP" --image "registry.fly.io/$FLY_APP:v$ANTERIOR" --strategy immediate

      - name: Notificar squad
        if: always()
        working-directory: .
        run: |
          [ -n "${{ secrets.TELEGRAM_WEBHOOK }}" ] && curl -sf -X POST "${{ secrets.TELEGRAM_WEBHOOK }}" -d "text=🚀 Gateway copiloto: ${{ job.status }} · ${{ github.sha }}" || true
